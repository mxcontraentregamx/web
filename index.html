<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de México</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        /* Reset básico */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        /* Contenedor del mapa */
        #map {
            width: 100%;
            height: 100vh; /* Ocupa toda la altura de la pantalla */
        }
    </style>
</head>
<body>
    <!-- Contenedor del mapa -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Coordenadas de México
        const mexicoCenter = [23.6345, -102.5528]; // Centro de México
        const mexicoBounds = L.latLngBounds(
            L.latLng(14.3886, -118.6532), // Esquina inferior izquierda (límite sur y oeste)
            L.latLng(32.7187, -86.4932)   // Esquina superior derecha (límite norte y este)
        );

        // Inicializar el mapa centrado en México
        const map = L.map('map').setView(mexicoCenter, 6); // Zoom inicial 6

        // Añadir capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Establecer límites del mapa para México
        map.setMaxBounds(mexicoBounds); // Limita el desplazamiento a México
        map.on('drag', () => {
            if (!mexicoBounds.contains(map.getCenter())) {
                map.panInsideBounds(mexicoBounds, { animate: true });
            }
        });

        // Ejemplo de marcadores en México
        const markers = [
            {
                name: "Ciudad de México",
                latlng: [19.4326, -99.1332], // Coordenadas de Ciudad de México
                url: "https://www.example.com/cdmx" // Enlace de redirección
            },
            {
                name: "Guadalajara",
                latlng: [20.6597, -103.3496], // Coordenadas de Guadalajara
                url: "https://www.example.com/guadalajara" // Enlace de redirección
            },
            {
                name: "Monterrey",
                latlng: [25.6866, -100.3161], // Coordenadas de Monterrey
                url: "https://www.example.com/monterrey" // Enlace de redirección
            },
            {
                name: "Cancún",
                latlng: [21.1619, -86.8515], // Coordenadas de Cancún
                url: "https://www.example.com/cancun" // Enlace de redirección
            },
            {
                name: "Oaxaca",
                latlng: [17.0732, -96.7266], // Coordenadas de Oaxaca
                url: "https://www.example.com/oaxaca" // Enlace de redirección
            },
            {
                name: "Tijuana",
                latlng: [32.5149, -117.0382], // Coordenadas de Tijuana
                url: "https://www.example.com/tijuana" // Enlace de redirección
            }
            // Añade más marcadores aquí
        ];

        // Añadir marcadores al mapa
        markers.forEach(marker => {
            const { name, latlng, url } = marker;
            L.marker(latlng)
                .addTo(map)
                .bindPopup(`<b>${name}</b><br><a href="${url}" target="_blank">Más información</a>`)
                .on('click', () => {
                    window.open(url, '_blank'); // Abrir enlace en una nueva pestaña
                });
        });

        // Asegurar que el mapa se redimensione correctamente
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
